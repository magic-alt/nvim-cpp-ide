name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lua-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck cmake ninja-build make

      - name: Shellcheck install scripts
        run: shellcheck install.sh uninstall.sh

      - name: Install Neovim stable (0.11+)
        run: |
          curl -fsSLo nvim.tar.gz https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          tar -xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Verify Neovim version
        run: |
          nvim --version | head -n 3
          nvim --headless -u NONE "+lua assert(vim.fn.has('nvim-0.11') == 1, 'Neovim 0.11+ required')" +qa

      - name: Smoke-test all profiles without network plugin bootstrap
        env:
          NVIM_CPP_IDE_SKIP_PLUGINS: "1"
          NVIM_CPP_IDE_QUIET: "1"
        run: |
          for profile in minimal cpp agent; do
            echo "Testing profile: $profile"
            NVIM_CPP_IDE_PROFILE="$profile" nvim --headless -u ./init.lua \
              "+lua assert(vim.g.nvim_cpp_ide_profile == '$profile')" +qa
          done

      - name: Exercise unified project task engine
        env:
          NVIM_CPP_IDE_SKIP_PLUGINS: "1"
          NVIM_CPP_IDE_QUIET: "1"
          NVIM_CPP_IDE_PROFILE: "cpp"
        run: |
          config="$GITHUB_WORKSPACE/init.lua"

          rm -rf tests/fixtures/cmake-presets/build
          (
            cd tests/fixtures/cmake-presets
            NVIM_CPP_IDE_CMAKE_PRESET=ci nvim --headless -u "$config" \
              "+lua local i=require('nvim_cpp_ide.project.engine').info(); assert(i.backend == 'cmake'); assert(i.tasks.configure.metadata.configure_preset == 'ci')" \
              "+ProjectTask configure" \
              "+ProjectTask build" \
              "+ProjectTask test" \
              "+ProjectTask lint" \
              "+ProjectTask format" +qa
          )

          (
            cd tests/fixtures/make
            nvim --headless -u "$config" \
              "+lua local i=require('nvim_cpp_ide.project.engine').info(); assert(i.backend == 'make'); assert(i.tasks.configure.available == false); assert(i.tasks.lint.metadata.override == true)" \
              "+ProjectTask build" \
              "+ProjectTask test" \
              "+ProjectTask lint" \
              "+ProjectTask format" +qa
          )

          (
            cd tests/fixtures/ninja
            nvim --headless -u "$config" \
              "+lua local i=require('nvim_cpp_ide.project.engine').info(); assert(i.backend == 'ninja'); assert(i.tasks.configure.available == false)" \
              "+ProjectTask build" \
              "+ProjectTask test" \
              "+ProjectTask lint" \
              "+ProjectTask format" +qa
          )

      - name: Exercise agent foundation
        env:
          NVIM_CPP_IDE_SKIP_PLUGINS: "1"
          NVIM_CPP_IDE_QUIET: "1"
          NVIM_CPP_IDE_PROFILE: "agent"
        run: |
          config="$GITHUB_WORKSPACE/init.lua"
          fixture="$GITHUB_WORKSPACE/tests/fixtures/agent-project"
          rm -f "$fixture/AGENTS.md"

          (
            cd "$fixture"
            nvim --headless -u "$config" \
              "+lua assert(vim.fn.exists(':AgentInit') == 2); assert(vim.fn.exists(':Agent') == 2); local r=require('nvim_cpp_ide.agent.registry'); assert(r.get('codex').argv[1] == 'codex'); vim.g.nvim_cpp_ide_agents={local_agent={'sh'}}; assert(r.get('local_agent').available == true)" \
              "+AgentInit" +qa
          )

          grep -q 'generated by nvim-cpp-ide :AgentInit' "$fixture/AGENTS.md"
          grep -q 'Detected build backend: `make`' "$fixture/AGENTS.md"
          grep -q '`src/`' "$fixture/AGENTS.md"
          grep -q '\*\*build\*\* argv:' "$fixture/AGENTS.md"
          grep -q 'ProjectTask build' "$fixture/AGENTS.md"
          grep -q 'Keep this project-specific note' "$fixture/CLAUDE.md"
          test "$(grep -c '^@AGENTS.md$' "$fixture/CLAUDE.md")" -eq 1
          if grep -Fq "$GITHUB_WORKSPACE" "$fixture/AGENTS.md"; then
            echo 'Generated AGENTS.md leaked an absolute workspace path'
            exit 1
          fi

          printf '\n<!-- user-maintained-rule -->\n' >> "$fixture/AGENTS.md"
          (
            cd "$fixture"
            nvim --headless -u "$config" "+AgentInit" +qa
          )
          grep -q 'user-maintained-rule' "$fixture/AGENTS.md"
          test "$(grep -c '^@AGENTS.md$' "$fixture/CLAUDE.md")" -eq 1

          (
            cd "$fixture"
            nvim --headless -u "$config" "+AgentInit!" +qa
          )
          if grep -q 'user-maintained-rule' "$fixture/AGENTS.md"; then
            echo 'AgentInit! failed to regenerate AGENTS.md'
            exit 1
          fi
          test "$(grep -c '^@AGENTS.md$' "$fixture/CLAUDE.md")" -eq 1

      - name: Exercise IDE to agent context bridge
        env:
          NVIM_CPP_IDE_SKIP_PLUGINS: "1"
          NVIM_CPP_IDE_QUIET: "1"
          NVIM_CPP_IDE_PROFILE: "agent"
        run: |
          config="$GITHUB_WORKSPACE/init.lua"
          fixture="$GITHUB_WORKSPACE/tests/fixtures/agent-project"
          rm -rf "$fixture/.nvim-agent"

          (
            cd "$fixture"
            nvim --headless -u "$config" \
              "+edit src/main.c" \
              "+lua local ns=vim.api.nvim_create_namespace('ci-agent-context'); local b=vim.api.nvim_get_current_buf(); local file=vim.api.nvim_buf_get_name(b); local root=vim.fn.getcwd(); vim.diagnostic.set(ns,b,{{lnum=0,col=4,severity=vim.diagnostic.severity.WARN,message='context diagnostic '..file,source='ci'}}); vim.fn.setqflist({},' ',{title='CI quickfix '..root,items={{filename=file,lnum=1,col=1,text='quickfix failure '..file,type='E'}}})" \
              "+ProjectTask build" \
              "+ProjectTask test" \
              "+AgentContext" +qa
          )

          test -f "$fixture/.nvim-agent/context.json"
          test -f "$fixture/.nvim-agent/context.md"
          test -f "$fixture/.nvim-agent/.gitignore"
          test "$(cat "$fixture/.nvim-agent/.gitignore")" = '*'

          python3 - "$fixture/.nvim-agent/context.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          data = json.loads(p.read_text())
          assert data["schema_version"] == 1
          assert data["project"]["root"] == "."
          assert data["project"]["backend"] == "make"
          assert data["current"]["file"] == "src/main.c"
          assert data["diagnostics"]["count"] == 1
          diagnostic = data["diagnostics"]["items"][0]
          assert diagnostic["severity"] == "WARN"
          assert diagnostic["message"] == "context diagnostic ./src/main.c"
          assert data["quickfix"]["title"] == "CI quickfix ."
          assert data["quickfix"]["count"] == 1
          assert data["quickfix"]["items"][0]["text"] == "quickfix failure ./src/main.c"
          assert data["task_results"]["by_action"]["build"]["code"] == 0
          assert data["task_results"]["by_action"]["test"]["code"] == 0
          assert data["git"]["available"] is True
          PY

          grep -q '# Neovim Agent Context' "$fixture/.nvim-agent/context.md"
          grep -q 'context diagnostic ./src/main.c' "$fixture/.nvim-agent/context.md"
          grep -q 'CI quickfix .' "$fixture/.nvim-agent/context.md"
          grep -q '## Last task results' "$fixture/.nvim-agent/context.md"

          if grep -Fq "$GITHUB_WORKSPACE" "$fixture/.nvim-agent/context.json" "$fixture/.nvim-agent/context.md"; then
            echo 'Agent context leaked an absolute workspace path'
            exit 1
          fi

          if [ -n "$(git -C "$fixture" status --short -- .nvim-agent)" ]; then
            echo '.nvim-agent runtime snapshots polluted git status'
            git -C "$fixture" status --short -- .nvim-agent
            exit 1
          fi

      - name: Parse PowerShell installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './install-lua.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }

  windows-powershell-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Windows PowerShell 5.1
        shell: powershell
        run: |
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1"
          }

      - name: Exercise remote installer with native Git stderr
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\install-lua.ps1 -SkipFirstLaunch -NoBackup

          $installed = Join-Path $env:LOCALAPPDATA 'nvim'
          if (-not (Test-Path (Join-Path $installed 'init.lua'))) {
            throw 'Remote installer did not install init.lua'
          }
          if (-not (Test-Path (Join-Path $installed 'lua\nvim_cpp_ide\agent\init.lua'))) {
            throw 'Remote installer did not install the modular Lua tree'
          }
